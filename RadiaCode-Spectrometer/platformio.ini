; PlatformIO Project Configuration File

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = default
upload_speed = 460800

; Override board configuration for JC4827W543 hardware (4MB Flash, 8MB PSRAM).
; Custom partition table: two 1.9 MB OTA app slots instead of the stock
; 1.31 MB, reclaimed from the unused SPIFFS region. See partitions.csv.
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB

; PSRAM. -D BOARD_HAS_PSRAM alone does NOT enable it: the framework picks a
; prebuilt sdkconfig by memory_type, and the default (qio_qspi) has SPIRAM
; off, so ESP.getPsramSize() reported 0 and every ps_malloc() silently fell
; back to the 72 KB of free heap. The template-fit matrix (156 KB) therefore
; failed to allocate and identification fell back to the old code path
; without saying so. Verified on hardware by [TPL] logging in templates.cpp.
board_build.arduino.memory_type = qio_opi

; Use root Libraries folder provided by user (Arduino_GFX-1.4.4, Touch_GT911, etc.)
lib_extra_dirs = Libraries

; Keep dependencies minimal; built-in SPI/Wire are provided by framework.
; ArduinoJson kept for future BLE/telemetry JSON (spectrum + isotope results).
; AsyncTCP/ESPAsyncWebServer removed with the old web "builder" UI — re-add if/when
; a web config or telemetry endpoint is needed for the spectrometer UI.
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM

; Avoid picking up duplicate Arduino_GFX under lib/ by ignoring it
lib_ignore = Arduino_GFX
